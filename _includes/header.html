<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/tmlr.jpg' | relative_url }}" alt="TMLR" width="68" height="48">
      <span>TMLR <em>Blog</em></span>
    </a>
    <nav class="site-nav" aria-label="Site">
      {%- for item in site.nav %}
      {%- if item.url contains '://' %}
      <a href="{{ item.url }}">{{ item.title }}</a>
      {%- else %}
      <a href="{{ item.url | relative_url }}"{% if item.url == page.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endif %}
      {%- endfor %}
      <button class="theme-toggle" type="button" aria-label="Switch to the light theme" title="Switch to the light theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path></svg>
      </button>
    </nav>
  </div>
</header>
